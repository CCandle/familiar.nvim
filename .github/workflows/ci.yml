name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --release -p familiar-core
      - name: Check optional embedded llama backend
        run: cargo check -p familiar-core --features local-llama
      - run: cargo fmt --all -- --check
      - name: Core protocol smoke test
        run: |
          output="$(printf '%s\n' \
            '{"type":"hello","protocol":2,"client":"ci"}' \
            '{"type":"configure","brain":{"enabled":false,"provider":"rule"}}' \
            '{"type":"ping","id":7}' \
            '{"type":"shutdown"}' \
            | target/release/familiar-core)"
          printf '%s\n' "$output"
          grep -q '"type":"ready"' <<<"$output"
          grep -q '"type":"brain_status"' <<<"$output"
          grep -q '"type":"pong"' <<<"$output"

  neovim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Neovim 0.12.2
        run: |
          curl -L -o nvim.tar.gz https://github.com/neovim/neovim/releases/download/v0.12.2/nvim-linux-x86_64.tar.gz
          tar xzf nvim.tar.gz
          echo "$PWD/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Lua smoke test
        run: nvim --headless -u tests/minimal_init.lua -l tests/smoke.lua
